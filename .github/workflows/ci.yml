name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify public snapshot
        run: python tooling/release/export_public.py --verify .
      - name: Install the package normally
        run: |
          python -m pip install ".[io,validation,geo,figures]" -c configs/requirements-reproduce.txt
          python -m pip install pytest geopandas -c configs/requirements-reproduce.txt
      - name: Confirm installed import
        run: python -I -c "import windowed_cusum; from pathlib import Path; p=Path(windowed_cusum.__file__); print(p); assert 'site-packages' in p.parts"
      - name: Run tests
        run: |
          python -c "from pathlib import Path; Path('.test-tmp').mkdir(exist_ok=True)"
          python -I -m pytest tests --import-mode=importlib -q -p no:cacheprovider --basetemp .test-tmp/ci
      - name: Run the synthetic example
        run: |
          python scripts/run_current_pipeline.py --output .test-tmp/current-demo
          python scripts/experiments/check_published_results.py
