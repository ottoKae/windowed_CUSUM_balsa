[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windowed-cusum-balsa"
version = "0.1.0"
description = "Windowed CUSUM analysis of monthly Sentinel-1 stand disturbances"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numba>=0.58",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
io = ["pyarrow>=12"]
validation = ["scikit-learn>=1.3", "scipy>=1.10"]
geo = [
  "affine>=2.4",
  "geopandas>=0.14",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "shapely>=2.0",
  "xarray>=2023.1",
  "zarr>=2.16",
]
figures = ["cartopy>=0.22", "matplotlib>=3.7", "pillow>=10"]
test = [
  "affine>=2.4",
  "pytest>=7.4",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "shapely>=2.0",
]

[project.scripts]
windowed-cusum = "lr_cusum.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
